<body>

<div id="toolbar">
  <div class="brand"><b>枝桠</b><span>ZHIYA</span></div>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-file">文件</button>
  <button class="tb-btn" id="btn-export">导出</button>
  <div class="tb-sep"></div>
  <select id="structure-select" title="结构引擎"></select>
  <div class="tb-sep tb-narrow-hide"></div>
  <button class="tb-btn tb-narrow-hide" id="btn-undo" disabled title="撤销 Ctrl+Z">↶</button>
  <button class="tb-btn tb-narrow-hide" id="btn-redo" disabled title="重做 Ctrl+Y">↷</button>
  <div class="tb-spacer"></div>
  <button class="tb-btn" id="btn-sidebar" title="侧边栏：大纲 / 备注 / 快捷键">☰ 侧栏</button>
</div>

<div id="viewport">
  <div id="sheet-bar"></div>
  <div id="hint">
    <h2>双击主题开始编辑</h2>
    <p class="kb-only"><em>Tab</em> 添加子主题 · <em>Enter</em> 添加同级 · <em>Space</em> 折叠 · 右键更多操作</p>
    <p class="touch-only">双击主题编辑 · 长按打开菜单 · 拖动主题调序 · 双指缩放画布</p>
  </div>
  <div id="world">
    <svg id="edges"></svg>
    <div id="figures"></div>
  </div>
</div>

<div id="sidebar">
  <div class="sb-tabs">
    <div class="sb-tab active" data-tab="outline">大纲</div>
    <div class="sb-tab" data-tab="notes">备注</div>
    <div class="sb-tab" data-tab="style">样式</div>
    <div class="sb-tab" data-tab="keys">快捷键</div>
  </div>
  <div class="sb-body" id="sb-body"></div>
</div>

<div id="zoom-cluster">
  <button id="zoom-out" title="缩小">−</button>
  <button id="zoom-fit" title="适应画布">▣</button>
  <button id="zoom-in" title="放大">＋</button>
  <span id="zoom-pct">100%</span>
</div>

<div id="sidebar-backdrop" aria-hidden="true"></div>
<div id="mobile-selection-bar" aria-hidden="true">
  <button type="button" id="ms-child" title="添加子主题 Tab">子级</button>
  <button type="button" id="ms-sibling" title="添加同级 Enter">同级</button>
  <button type="button" id="ms-note" title="备注 Ctrl+M">备注</button>
  <button type="button" id="ms-del" title="删除分支 Delete">删除</button>
</div>
<div id="statusbar">
  <div class="stat-leading">
    <div id="stat-left">—</div>
    <div id="stat-actions" class="stat-actions" hidden aria-hidden="true">
      <button type="button" class="stat-act" id="sa-sibling" title="添加同级主题 Enter">同级</button>
      <button type="button" class="stat-act" id="sa-note" title="备注 Ctrl+M">备注</button>
      <button type="button" class="stat-act danger" id="sa-del" title="删除分支 Delete">删除</button>
    </div>
  </div>
  <div id="stat-right">v—</div>
</div>

<div id="toast"></div>
<div id="drop-line"></div>
<div id="ctx-menu"></div>
<div id="find-bar">
  <input id="find-input" placeholder="查找标题与备注…" />
  <span id="find-count"></span>
  <button id="find-prev" title="上一个 (Shift+Enter)">↑</button>
  <button id="find-next" title="下一个 (Enter)">↓</button>
  <input id="find-replace" placeholder="替换为…" />
  <button id="find-replace-btn" title="替换当前">替换</button>
  <button id="find-replace-all" title="全部替换">全部</button>
  <button id="find-close" title="关闭 (Esc)">×</button>
</div>
<div id="note-panel">
  <header><span id="note-topic">—</span><b>备注</b><button id="note-close">×</button></header>
  <textarea id="note-input" placeholder="为此主题添加备注（Esc 收起）"></textarea>
</div>
<input type="file" id="file-input" accept=".json,.xmind" hidden>
<input type="file" id="image-input" accept="image/*" hidden>
<input type="file" id="attach-input" hidden>
<input type="file" id="theme-input" accept=".json,application/json" hidden>
<div id="href-panel">
  <span class="hp-title">链接</span>
  <input id="href-input" placeholder="https:// 或选择附件后自动填入" />
  <button id="href-ok">确定</button>
  <button id="href-cancel">取消</button>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
